<script>
function EventFieldOnChange_ems_ctry_eccn_ctry_code(theWidget)
{
	// Function to handle the on change event.  Return false to stop the user from leaving the field.

	if (theWidget == null || theWidget.value == "")
		return true;

	var theUserInput = SanitizeUserInput(theWidget.value);

	var strWhere = "ems_ctry.ctry_code = '" + theUserInput.toUpperCase() + "'";
	var aPopupNode = ValidateWizard("ctry_code@ems_ctry", strWhere);
	if (aPopupNode != null)
	{
		var anAttrib = aPopupNode.attributes.getNamedItem("ctry_code");
		if (anAttrib != null)
			theWidget.value = anAttrib.text;

		return true;
	}
	else {
		strMsg = "Invalid data entered.  Please reenter or select from the pop-up.";
		PopupAlertConfirm("General","20", strMsg, 1);
		theWidget.select();
		theWidget.focus();
		return false;
	}

}
</script>
