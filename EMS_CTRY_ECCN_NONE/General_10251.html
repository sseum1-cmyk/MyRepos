<script>
var theTableName = 'ems_ctry_eccn';

function processSaveVerification()
{
	var aSLResponse;
	var aException = new SLRef(null);
	var aSLRequest = SLCreateRequest("vastera.content.utils.ContentCtryUtil.processSaveVerification", "", true, "ComplianceEngine");
	
	var aeccn_num = GetValue(window, "ems_ctry_eccn", "eccn_num");
	var asub_org = GetValue(window, "ems_ctry_eccn", "sub_org");
	var actry_code = GetValue(window, "ems_ctry_eccn", "ctry_code");
	var alic_ga_code = GetValue(window, "ems_ctry_eccn", "lic_ga_code");
	var acontent_type = actry_code + 'ECCN';
	
	/* Create an array with the record keys in the order in which they appear in the database table. */
	var theKeyValues =  SLCreateArray();
	
	SLAddSimpleValue(theKeyValues, actry_code);
	SLAddSimpleValue(theKeyValues, asub_org);
	SLAddSimpleValue(theKeyValues, aeccn_num);
	SLAddSimpleValue(theKeyValues, alic_ga_code);
		
	/* Add the parameters to the SL request in the appropriate order. */
	SLAddStructOrArrayValue(aSLRequest, theKeyValues.m_DOM.documentElement);
	SLAddSimpleValue(aSLRequest, acontent_type);
	SLAddSimpleValue(aSLRequest, theTableName);
	
	aSLResponse = SLInvoke(aSLRequest);
	
	if (aSLResponse.m_Exception == null)
	{
	
		var isProcessSuccessful = SLGetSimpleValue(aSLResponse);
		
		if(isProcessSuccessful == 'TRUE')
		{
			//PopupAlertConfirm("GP","0001","Verification record saved.", 1);
		}
		else
		{
			PopupAlertConfirm("GP","0001","Failed to update verification table.", 1);
		}
	}
	else
	{
		aException.m_Value = aSLResponse.m_Exception;
		alert(aSLResponse.m_Exception.m_MsgList[0]);
	} 
}
</script>

<script>
function doesContentTypeExists(contentType)
{
	var aSLResponse;
	var aException = new SLRef(null);
	var aSLRequest = SLCreateRequest("vastera.content.utils.ContentCtryUtil.getCurrentEventId", "", true, "ComplianceEngine");
	
	var country;
	var content_type;
	
	if (contentType!== undefined)
	{
		content_type = contentType;
	}
	else
	{
		country = GetValue(window, "ems_ctry_eccn", "ctry_code");
		content_type = country + 'ECCN';
	}
	SLAddSimpleValue(aSLRequest, content_type);
	aSLResponse = SLInvoke(aSLRequest);
	
	if (aSLResponse.m_Exception == null)
	{
		var event_id = SLGetSimpleValue(aSLResponse);
		
		if(event_id == -1)
		{
			//The content type is not defined in the master table.
			return content_type;
		}
		else
		{
			//The content type is defined in the master table.
			return '';
		}
	}
	else
	{
		aException.m_Value = aSLResponse.m_Exception;
		PopupAlertConfirm("GP","0001",aException.m_Value, 1);
	} 
}
</script>
<script>
function getCurrentEventId()
{
	var aSLResponse;
	var aException = new SLRef(null);
	var aSLRequest = SLCreateRequest("vastera.content.utils.ContentCtryUtil.getCurrentEventId", "", true, "ComplianceEngine");
	
	var country = GetValue(window, "ems_ctry_eccn", "ctry_code");
	var content_type = country + 'ECCN';
	
	SLAddSimpleValue(aSLRequest, content_type);
	aSLResponse = SLInvoke(aSLRequest);
	
	if (aSLResponse.m_Exception == null)
	{
	
		var event_id = SLGetSimpleValue(aSLResponse);
		
		if(event_id == -1)
		{
			current_event_id.innerHTML = "&nbsp;" + 0;
			PopupAlertConfirm("GP","0001","There is no Content Type " + content_type + " defined in the master table.", 1);
			SetWidgetState(btnIncrementEventId,true);
			//window.parent.g_WindowReadOnly = true;
		}
		else
		{
			current_event_id.innerHTML = "&nbsp;" + event_id;
			aException = new SLRef(null);
			aSLRequest = SLCreateRequest("vastera.content.utils.ContentCtryUtil.getRecordsWithEventIDOlderThanOneDay", "", true, "ComplianceEngine");
			
			SLAddSimpleValue(aSLRequest, content_type);
			SLAddSimpleValue(aSLRequest, theTableName);
			
			aSLResponse = SLInvoke(aSLRequest);
			if (aSLResponse.m_Exception == null)
			{
				var areRecordsWithEventIdOlder = SLGetSimpleValue(aSLResponse);
				if(areRecordsWithEventIdOlder > 0)
				{
					divEventIdOlder.style.display ='block';
				}
				else
				{
					divEventIdOlder.style.display ='none';
				}
			}
			else
			{
				PopupAlertConfirm("GP","0001",aException.m_Value, 1);
			}
			
		}
	}
	else
	{
		aException.m_Value = aSLResponse.m_Exception;
		alert(aSLResponse.m_Exception.m_MsgList[0]);
	} 

}
</script>
<script>
function incrementEventId()
{
	var aSLResponse;
	var aException = new SLRef(null);
	var aSLRequest = SLCreateRequest("vastera.content.utils.ContentCtryUtil.incrementCurrentEventId", "", true, "ComplianceEngine");
	
	var country = GetValue(window, "ems_ctry_eccn", "ctry_code");
	var content_type = country + 'ECCN';
	
	SLAddSimpleValue(aSLRequest, content_type);
	aSLResponse = SLInvoke(aSLRequest);
	
	if (aSLResponse.m_Exception == null)
	{
	
		var event_id = SLGetSimpleValue(aSLResponse);
		
		if(event_id == -1)
		{
			PopupAlertConfirm("GP","0001","Error incrementing current event ID for Content Type " + content_type + "." , 1);
		}
		else
		{
			getCurrentEventId();
			PopupAlertConfirm("GP","0001","Event ID successfully incremented for Content Type " + content_type + "." , 1);
		}
	}
	else
	{
		aException.m_Value = aSLResponse.m_Exception;
		alert(aSLResponse.m_Exception.m_MsgList[0]);
	} 
}
</script>

<script for="ems_ctry_eccn_ctl_pullBtn" event="onclick">
    var matchFound = new Boolean;
    var aListOfCtls = new Array();
    var aCtlCodes = new Array();
	var oPDNode;
	
    var oMasterData	= GPDataGetMasterGPData().selectSingleNode("//ems_ctry_eccn");
	var aCtryCode = GetColumnValue(DataTable_ems_ctry_eccn,'ctry_code');
		
	//var strWhere = "emss_type_value.type = 'CTL_COMM_EXP'";
	WizardXMLFilePath("content/html/EMS_CTRY_ECCN_NONE/xml/");
    var strWhere   = "emss_type_value.user_varchar_1 =  '" + aCtryCode + "'";
	var aPopupNode = ShowWizardAsType("ctl_code@emss_type_value", strWhere, "", "list");
    if (aPopupNode != null)
    {
        var aNodeList = aPopupNode.selectNodes('//PopupResult');
        if (aNodeList.length != 0)
        {
            for (var aIndex = 0; aIndex < aNodeList.length; aIndex++)
            {
                aNode = aNodeList.item(aIndex);
                aListOfCtls[aIndex] = new Object();
                aListOfCtls[aIndex].ctl_code = aNode.getAttribute('user_varchar_2');
                aListOfCtls[aIndex].description = aNode.getAttribute('description');
            }
	
            if (DataTable_ems_ctry_eccn_ctl.rows.length != 0)
            {
                  
                for (var j = 0; j < DataTable_ems_ctry_eccn_ctl.rows.length; j++)
                {
                    aCtlCodes[j] = GetValue(window, 'ems_ctry_eccn_ctl', 'ctl_code', (j+1));
                }
						
                for (var i = 0; i < aListOfCtls.length; i++)
                {
                    matchFound = false;
                    var control_code = aListOfCtls[i].ctl_code;
                    var strDescription = aListOfCtls[i].description;

                            for (var j = 0; j < DataTable_ems_ctry_eccn_ctl.rows.length; j++)
                            {
                                    if (control_code == aCtlCodes[j])
                                    {
                                            matchFound = true;
                                            break;
                                    }
                            }
							
                            if (matchFound != true)
                            {
                                aCtlCodes[DataTable_ems_ctry_eccn_ctl.rows.length] = control_code;
                                
                                oPDNode = SchemaGetKeyDesc('ems_ctry_eccn_ctl');
                                oPDNode.setAttribute('ctry_code', aCtryCode);
                                oPDNode.setAttribute('sub_org', oMasterData.getAttribute('sub_org'));
                                oPDNode.setAttribute('eccn_num', oMasterData.getAttribute('eccn_num'));
                                oPDNode.setAttribute('lic_ga_code', oMasterData.getAttribute('lic_ga_code'));
                                oPDNode.setAttribute('ctl_code', control_code);
                                oPDNode.setAttribute('description', strDescription);

                                DeltaMgmtRecordInsert(oPDNode);
                                oMasterData.appendChild(oPDNode);
                            }
			    }
                        
                ReloadPage();
            }
		}
    }
	    
</script>
